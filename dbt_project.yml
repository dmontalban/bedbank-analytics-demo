name: bedbank_analytics
version: "1.0.0"
config-version: 2
profile: bedbank

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  data_cutoff: "2026-10-31"     # last day of data in the (synthetic) feed

models:
  bedbank_analytics:
    staging:
      +materialized: table
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
